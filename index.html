<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>StudyDeck</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>

        <header>
            <div class="header-top">
                <div class="header-left">
                    <button id="backBtn" style="display:none;">← Back</button>
                    <button id="homeBtn" style="display:none;">🏠</button>
                </div>

                <h1 id="headerTitle">Study Deck</h1>

                <div class="header-right">
                    <button id="themeToggle">🌙</button>
                    <button id="studyModeBtn" style="display:none;">🟨</button>
                </div>
            </div>

            <div class="header-bottom">
                <input type="text" id="searchBox" placeholder="Search questions..." style="display:none;">
            </div>
        </header>


        <main id="cardsContainer">
            <!-- Cards will be inserted here by script.js -->
        </main>

        <script src="libs/marked.min.js"></script>
        <script src="script.js"></script>
        
    </body>

</html>
